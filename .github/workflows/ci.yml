name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium

      # Rebuild every generated file and fail if the committed files differ (someone edited output by hand or forgot to build)
      - name: Generated files are up to date
        run: npm run build:check

      - name: Lint HTML
        run: npm run lint

      - name: Tests
        run: npm test
