name: Live site check

# Weekly (and on demand): the deployed site still answers every URL people have, sends its security headers,
# and loads every page without Content-Security-Policy violations or console errors.
on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: URLs, headers and console errors
        run: npm run test:live
      - name: Content-Security-Policy violations
        run: node tools/csp-check.mjs
